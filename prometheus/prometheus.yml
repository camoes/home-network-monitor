global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  # Each scrape triggers an Ookla test; keep this deliberately infrequent.
  - job_name: speedtest
    scrape_interval: 30m
    scrape_timeout: 3m
    static_configs:
      - targets: ['speedtest:9798']

  - job_name: isp-contract
    static_configs:
      - targets: ['contract-exporter:9799']

  - job_name: zte-router-wan
    scrape_interval: 1m
    scrape_timeout: 15s
    static_configs:
      - targets: ['router-exporter:9800']

  - job_name: netviz-dns
    scrape_interval: 60s
    scrape_timeout: 20s
    static_configs:
      - targets: ['dns-map:8080']

  # Packet-capture sensors: el del Mac (nativo, vía gateway de Docker) y el de
  # Perdigon (host de la LAN, enchufado al puerto espejo del switch).
  - job_name: netviz-capture
    scrape_interval: 30s
    scrape_timeout: 15s
    static_configs:
      - targets: ['host.docker.internal:9101']
        labels:
          sensor: mac
      - targets: ['192.0.2.46:9101']
        labels:
          sensor: equipo
          iface: mirror

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://www.google.com
          - https://www.cloudflare.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115


