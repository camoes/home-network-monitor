apiVersion: 1

providers:
  - name: 'Network Monitoring'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
      # Si se elimina un JSON del directorio, Grafana retira el dashboard.
      prune: true
